name: Release auth diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-release-state-handling'
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub CLI version
        run: gh --version

      - name: Reproduce original lookup without repository context
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo 'original-command-without-checkout-or-repo:'
          gh release view v0.2.6 --json isDraft --jq '.isDraft'
          echo "exit=$?"

      - name: Verify explicit repository lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'explicit-repo-command:'
          gh release view v0.2.6 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isImmutable,publishedAt,url
          test "$(gh release view v0.2.6 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
