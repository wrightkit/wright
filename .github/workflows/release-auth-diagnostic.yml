name: Release auth diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-release-state-handling'
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub CLI version
        run: gh --version

      - name: Query v0.2.6 with workflow token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo 'token=github.token'
          gh release view v0.2.6 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isImmutable,publishedAt,url
          echo "exit=$?"

      - name: Query v0.2.6 with dedicated token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -uo pipefail
          echo 'token=secrets.GH_TOKEN'
          gh release view v0.2.6 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isImmutable,publishedAt,url
          echo "exit=$?"
