name: Release auth diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-release-state-handling'
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub CLI version
        run: gh --version

      - name: Reproduce release lookups with workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v0.2.5 v0.2.6; do
            echo "tag=${tag} token=github.token"
            gh release view "${tag}" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isImmutable,publishedAt,url
            printf 'isDraft=<%s>\n' "$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            printf 'publishedAt=<%s>\n' "$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
            if gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true; then
              echo 'wait-expression=PASS'
            else
              echo 'wait-expression=FAIL'
            fi
          done

      - name: Reproduce release guard with dedicated token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          tag=v0.2.6
          is_draft="$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          published_at="$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          printf 'isDraft=<%s> publishedAt=<%s>\n' "${is_draft}" "${published_at}"
          if [[ "${is_draft}" == "true" && "${published_at}" == "null" ]]; then
            echo 'guard-expression=PASS'
          else
            echo 'guard-expression=FAIL'
          fi
