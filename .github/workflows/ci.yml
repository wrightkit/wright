name: CI

# ---------------------------------------------------------------------------
# Trigger rules
# ---------------------------------------------------------------------------
# Push to main: capability checks are selected by changed paths, just like PRs.
# Broad changes still run the full convergence set.
# PR: capability checks are selected by changed paths.  Broad/core changes
# (Cargo workspace, scripts, compatibility fixtures, CI itself) expand to the
# full check set; narrow path changes run only the relevant capability.
# Docs-only changes skip CI entirely.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Path filter: determines which capability jobs run on PRs.
# On push-to-main the previous commit is compared with the pushed revision.
# ---------------------------------------------------------------------------
jobs:
  paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust_core: ${{ steps.f.outputs.rust_core }}
      opy: ${{ steps.f.outputs.opy }}
      lpp: ${{ steps.f.outputs.lpp }}
      cli: ${{ steps.f.outputs.cli }}
      dist: ${{ steps.f.outputs.dist }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute path filters
        id: f
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "rust_core=true"   >> "$GITHUB_OUTPUT"
            echo "opy=true"         >> "$GITHUB_OUTPUT"
            echo "lpp=true"         >> "$GITHUB_OUTPUT"
            echo "cli=true"         >> "$GITHUB_OUTPUT"
            echo "dist=true"        >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            changed="$(git diff --name-only "${base}" "${head}")"
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed="$(git diff --name-only "${base}...${head}")"
          fi

          # Helper: returns "true" if any path matches the given grep pattern.
          matches() { echo "$changed" | grep -qE "$1" && echo "true" || echo "false"; }

          # Core Rust workspace changes expand all Rust-based checks.
          broad="(^Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^\.cargo/|^(src|crates|compatibility|scenarios)/|^scripts/|^\.github/workflows/)"
          broad_match="$(matches "$broad")"

          echo "rust_core=${broad_match}"   >> "$GITHUB_OUTPUT"
          echo "opy=${broad_match}"         >> "$GITHUB_OUTPUT"
          echo "lpp=${broad_match}"         >> "$GITHUB_OUTPUT"
          echo "cli=${broad_match}"         >> "$GITHUB_OUTPUT"

          # Distribution validation additionally triggers on dist/ manifests and
          # the first-party Windows installer.
          dist_match="$(matches "(^dist/|^install\\.(sh|ps1)$|${broad})")"
          echo "dist=${dist_match}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # [1] RUST QUALITY & TESTS  (fundamental gate)
  # All other Rust-based jobs depend on this.
  # -------------------------------------------------------------------------
  rust-quality:
    name: Rust (stable)
    needs: paths
    if: needs.paths.outputs.rust_core == 'true'
    uses: wrightkit/.github/.github/workflows/rust-quality.yml@a83d0f1b4cbcb5b81fb0426e3a5aea1db0899fb5
    with:
      toolchain: stable
      cache-shared-key: linux-quality-stable-dev-test
      all-features: true

  # The reusable quality workflow installs its requested toolchain, but the
  # repository rust-toolchain.toml remains authoritative for bare Cargo
  # commands. Keep the MSRV gate local so every command explicitly selects
  # 1.85.0 and cannot silently fall back to stable.
  rust-msrv:
    name: Rust (1.85.0)
    needs: paths
    if: needs.paths.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-1.85.0-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Check formatting with MSRV toolchain
        run: cargo +1.85.0 fmt --all -- --check

      # opy-rs 0.1.38 declares 1.85.0 but currently uses unstable let-chain
      # syntax. Keep the owner-independent Wright crates on the declared MSRV;
      # the stable quality gate above remains the full workspace gate.
      - name: Run MSRV clippy for owner-independent crates
        run: >-
          cargo +1.85.0 clippy --locked --all-targets --all-features
          -p wright-core -p wright-ir -p wright-analyzer -p wright-transform
          -p wright-lpp -- -D warnings

      - name: Run MSRV tests for owner-independent crates
        run: >-
          cargo +1.85.0 test --locked --all-targets --all-features
          -p wright-core -p wright-ir -p wright-analyzer -p wright-transform
          -p wright-lpp

  # -------------------------------------------------------------------------
  # [1a] WRIGHT CLI ARTIFACT  (stable/debug executable for compatible jobs)
  # Build this exact workflow revision once. Consumers below need the CLI
  # executable only; jobs with another output or test-build identity stay
  # independent.
  # -------------------------------------------------------------------------
  wright-cli-build:
    name: Build Wright CLI (stable/debug)
    needs: [paths, rust-quality, rust-msrv]
    if: needs.paths.outputs.opy == 'true' || needs.paths.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-stable-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      - name: Build wright CLI (debug)
        run: cargo build --locked -p wright-cli

      - name: Upload current-run Wright CLI
        uses: actions/upload-artifact@v7
        with:
          name: wright-cli-linux-stable-debug
          path: target/debug/wright
          if-no-files-found: error

      - name: Record CLI artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Wright CLI artifact"
            echo ""
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Build identity: stable / debug / ubuntu-latest"
            echo "- SHA-256: \`$(sha256sum target/debug/wright | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # [1b] WORKSHOP REAL-PROJECT INTEGRATION  (Wright's released Workshop consumer)
  # Runs the owner-pinned real-project inputs through the actual `wright`
  # check/lint commands. The source snapshots and residual expectations remain
  # owned by the released workshop-rs corpus.
  # -------------------------------------------------------------------------
  workshop-integration:
    name: Workshop real-project integration
    needs: [paths, rust-quality, rust-msrv]
    if: needs.paths.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Wright
        uses: actions/checkout@v7

      - name: Check out released workshop-rs corpus
        uses: actions/checkout@v7
        with:
          repository: wrightkit/workshop-rs
          ref: 4a9f2dae36c47d50b8396563dd42cb9c750106ec # v0.3.9
          path: workshop-rs-pinned

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-stable-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      - name: Run owner-contract cross-validation
        env:
          WRIGHTKIT_WORKSHOP_CORPUS_DIR: ${{ github.workspace }}/workshop-rs-pinned/crates/workshop-rs/tests/fixtures/real-projects
        run: cargo test --locked -p wright-driver --test workshop_contract -- --ignored

      - name: Run Wright check and lint on real projects
        env:
          WRIGHTKIT_WORKSHOP_CORPUS_DIR: ${{ github.workspace }}/workshop-rs-pinned/crates/workshop-rs/tests/fixtures/real-projects
        run: cargo test --locked -p wright-cli --test workshop_real_projects -- --ignored --nocapture

  # -------------------------------------------------------------------------
  # [2] OPY INTEGRATION  (Wright's consumer contract with OverPy/OPY)
  # Covers:
  #   - Committed compatibility evidence integrity (no live oracle needed)
  #   - Semantic gate: Wright compile vs recorded reference snapshots through WIR
  #   - Provider-backed OPY consumer contract coverage
  # -------------------------------------------------------------------------
  opy-integration:
    name: OPY integration (semantic + owner)
    needs: [paths, rust-quality, rust-msrv, wright-cli-build]
    if: needs.paths.outputs.opy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-stable-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      - name: Download current-run Wright CLI
        uses: actions/download-artifact@v8
        with:
          name: wright-cli-linux-stable-debug
          path: target/debug

      - name: Prepare Wright CLI executable
        run: chmod +x target/debug/wright

      - name: Validate committed compatibility evidence
        run: python3 -m unittest discover -s compatibility/tests

      - name: Run semantic OPY gate (Wright compile vs recorded snapshots)
        id: semantic_gate
        run: python3 scripts/v1-gates.py

      - name: Upload OPY integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opy-integration-reports
          path: |
            target/v1-gates-report.json

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## OPY Integration"
            echo ""
            # Semantic gate summary derived from the JSON report
            if [[ -f target/v1-gates-report.json ]]; then
              python3 - <<'PYEOF'
          import json

          r = json.load(open("target/v1-gates-report.json"))
          s = r.get("summary", {})
          passed = s.get("passed", 0)
          total = s.get("total", 0)
          state = "PASS" if passed == total else "FAIL"
          icon = "✅" if passed == total else "❌"

          print(f"### Semantic OPY gate: {icon} {state} ({passed}/{total} fixtures)")
          print("")

          failures = [(fid, f) for fid, f in r.get("fixtures", {}).items()
                      if f.get("status") != "pass"]
          if failures:
              print("**Failures:**")
              for fid, f in failures:
                  print(f"- `{fid}`: {f.get('status', 'unknown')}")
          else:
              print("All fixtures passed.")
          PYEOF
            else
              echo "### Semantic OPY gate: ⚠️ report not generated"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # [3] LPP INTEGRATION  (Wright's Language Provider Protocol client contract)
  # -------------------------------------------------------------------------
  lpp-integration:
    name: LPP client integration (#142, #139)
    needs: [paths, rust-quality, rust-msrv]
    if: needs.paths.outputs.lpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-stable-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      # The mock provider is built from the pinned language-provider-protocol
      # commit the integration tests were validated against (merged LPP v1,
      # PR wrightkit/language-provider-protocol#2 plus docs-only follow-ups).
      - name: Check out language-provider-protocol (pinned)
        uses: actions/checkout@v7
        with:
          repository: wrightkit/language-provider-protocol
          ref: 416b293e26e6fb2d29061608a493a7aecd2ce14f
          path: language-provider-protocol

      - name: Build the pinned LPP mock provider
        run: cargo build --locked -p lpp-mock-provider
        working-directory: language-provider-protocol

      # REQUIRED: these suites self-skip when LPP_MOCK_PROVIDER is absent,
      # so the variable must be set here for them to run at all.
      - name: Run LPP client integration tests (required)
        env:
          LPP_MOCK_PROVIDER: ${{ github.workspace }}/language-provider-protocol/target/debug/lpp-mock-provider
        run: |
          cargo test --locked -p wright-lpp --test mock_provider
          cargo test --locked -p wright-driver --test lpp
          cargo test --locked -p wright-driver --test provider_edit

  # -------------------------------------------------------------------------
  # [4] CLI BEHAVIOR  (Wright CLI GitHub Actions renderer smoke test)
  # Validates CLI output format in a real GitHub Actions environment.
  # Related to #164 (user-facing GHA renderer); this job validates the
  # repository CI integration, not the renderer semantics layer.
  # -------------------------------------------------------------------------
  cli-behavior:
    name: Wright CLI behavior (GitHub Actions smoke)
    needs: [paths, rust-quality, rust-msrv, wright-cli-build]
    if: needs.paths.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Download current-run Wright CLI
        uses: actions/download-artifact@v8
        with:
          name: wright-cli-linux-stable-debug
          path: target/debug

      - name: Prepare Wright CLI executable
        run: chmod +x target/debug/wright

      - name: Exercise auto GitHub Actions renderer
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/wright-gha-smoke.ws"
          stdout="$RUNNER_TEMP/wright-gha-smoke.stdout"
          stderr="$RUNNER_TEMP/wright-gha-smoke.stderr"
          cat > "$fixture" <<'EOF'
          rule ("gha smoke") {
              event {
                  Ongoing - Global;
              }
              actions {
                  Disable Inspector Recording;
              }
          }
          EOF
          target/debug/wright check "$fixture" > "$stdout" 2> "$stderr"
          test ! -s "$stdout"
          grep -Fq '::group::wright check' "$stderr"
          grep -Fq '::endgroup::' "$stderr"
          ! grep -Fq 'title=Wright summary' "$stderr"
          grep -Fq 'Wright `check`: **PASS** (exit 0)' "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # [5] SCENARIO VALIDATION  (end-to-end compile-time scenario regression)
  # Proves Wright compile-time WIR/emission contracts for declared scenarios.
  # Depends on rust-quality (fundamental gate).
  # -------------------------------------------------------------------------
  scenario-validation:
    name: Scenario validation (end-to-end)
    needs: [paths, rust-quality, rust-msrv, wright-cli-build]
    if: needs.paths.outputs.opy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-stable-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      - name: Download current-run Wright CLI
        uses: actions/download-artifact@v8
        with:
          name: wright-cli-linux-stable-debug
          path: target/debug

      - name: Prepare Wright CLI executable
        run: chmod +x target/debug/wright

      - name: Run compile-time scenarios
        id: scenarios
        run: python3 scripts/run-scenarios.py

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-report
          path: target/scenarios-report.json

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Scenario Validation"
            echo ""
            if [[ -f target/scenarios-report.json ]]; then
              python3 - <<'PYEOF'
          import json

          r = json.load(open("target/scenarios-report.json"))
          s = r.get("summary", {})
          passed = s.get("passed", 0)
          total = s.get("total", 0)
          icon = "✅" if passed == total else "❌"
          state = "PASS" if passed == total else "FAIL"

          print(f"### Scenarios: {icon} {state} ({passed}/{total})")
          print("")

          failures = [(sid, sc) for sid, sc in r.get("scenarios", {}).items()
                      if not sc.get("passed")]
          if failures:
              print("**Failed scenarios:**")
              for sid, sc in failures:
                  failed_checks = [c["check"] for c in sc.get("checks", []) if not c["passed"]]
                  print(f"- `{sid}`: {', '.join(failed_checks) or 'compile failed'}")
          else:
              print("All scenarios passed.")
          PYEOF
            else
              echo "### Scenarios: ⚠️ report not generated"
            fi
            echo ""
            echo "_Full machine-readable report available as workflow artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # [6] BENCHMARK  (performance evidence)
  # Non-blocking on PRs; records regression-detectable output as artifact.
  # Depends on rust-quality so a fundamental failure skips benchmark time.
  # -------------------------------------------------------------------------
  benchmark:
    name: Performance benchmarks
    needs: [paths, rust-quality, rust-msrv]
    if: needs.paths.outputs.opy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality-stable-dev-test
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      - name: Build benchmark (stable/debug)
        run: cargo build --locked -p wright-bench

      - name: Run benchmarks
        id: bench
        run: target/debug/wright-bench

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: target/wright-bench-report.json

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Performance Benchmarks"
            echo ""
            if [[ "${{ steps.bench.outcome }}" == "success" ]]; then
              echo "### Benchmarks: ✅ completed"
            else
              echo "### Benchmarks: ❌ FAIL"
            fi
            if [[ -f target/wright-bench-report.json ]]; then
              python3 - <<'PYEOF'
          import json

          r = json.load(open("target/wright-bench-report.json"))
          # Emit a compact table if the report has benchmark entries.
          benches = r.get("benchmarks") or r.get("results") or []
          if benches:
              print("")
              print("| Benchmark | Duration |")
              print("| --- | --- |")
              for b in benches[:20]:  # cap at 20 rows
                  name = b.get("name") or b.get("id", "?")
                  dur = (b.get("duration_ms") or b.get("elapsed_ms") or b.get("ns"))
                  unit = "ms" if ("duration_ms" in b or "elapsed_ms" in b) else ("ns" if "ns" in b else "")
                  print(f"| {name} | {dur}{unit} |")
              if len(benches) > 20:
                  print(f"_... and {len(benches) - 20} more (see artifact)_")
          PYEOF
              echo ""
              echo "_Full machine-readable report available as workflow artifact._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # [8] DISTRIBUTION VALIDATION  (cross-platform package/binary smoke)
  # When source changes are in scope, this remains gated on the relevant Rust
  # and integration jobs. Distribution-only changes run this job directly.
  # -------------------------------------------------------------------------
  dist-cli-build:
    name: Build distribution CLI/LSP (${{ matrix.os }})
    needs:
      - paths
      - rust-quality
      - rust-msrv
      - opy-integration
      - lpp-integration
    if: |
      always() &&
      needs.paths.outputs.dist == 'true' &&
      (needs.rust-quality.result == 'success' || needs.paths.outputs.rust_core != 'true') &&
      (needs.rust-msrv.result == 'success' || needs.paths.outputs.rust_core != 'true') &&
      (needs.opy-integration.result == 'success' || needs.paths.outputs.opy != 'true') &&
      (needs.lpp-integration.result == 'success' || needs.paths.outputs.lpp != 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist-validation-${{ runner.os }}-stable-dev
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Build wright CLI and LSP
        shell: bash
        run: cargo build --locked -p wright-cli -p wright-lsp

      - name: Record distribution build identity
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          cat > target/debug/wright-dist.build.json <<EOF
          {"revision":"${GITHUB_SHA}","runner_os":"${RUNNER_OS}","target":"${host_target}","toolchain":"stable","profile":"dev","packages":["wright-cli","wright-lsp"],"features":[]}
          EOF

      - name: Upload current-run distribution binaries
        uses: actions/upload-artifact@v7
        with:
          name: wright-dist-cli-${{ matrix.os }}
          path: |
            target/debug/wright
            target/debug/wright.exe
            target/debug/wright-lsp
            target/debug/wright-lsp.exe
            target/debug/wright-dist.build.json
          if-no-files-found: error

  dist-validation:
    name: Distribution validation (${{ matrix.channel }}, ${{ matrix.os }})
    needs:
      - paths
      - rust-quality
      - rust-msrv
      - opy-integration
      - lpp-integration
      - dist-cli-build
    if: |
      always() &&
      needs.paths.outputs.dist == 'true' &&
      (needs.rust-quality.result == 'success' || needs.paths.outputs.rust_core != 'true') &&
      (needs.rust-msrv.result == 'success' || needs.paths.outputs.rust_core != 'true') &&
      (needs.opy-integration.result == 'success' || needs.paths.outputs.opy != 'true') &&
      (needs.lpp-integration.result == 'success' || needs.paths.outputs.lpp != 'true') &&
      needs.dist-cli-build.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: install.sh
          - os: macos-15
            channel: install.sh
          - os: macos-15
            channel: Homebrew
          - os: windows-latest
            channel: install.ps1
          - os: windows-latest
            channel: Scoop
          - os: windows-latest
            channel: WinGet
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Scoop for Scoop validation
        if: matrix.channel == 'Scoop'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scoopShims = Join-Path $env:USERPROFILE "scoop\shims"
          Add-Content -Path $env:GITHUB_PATH -Value $scoopShims
          $env:PATH = "$scoopShims;$env:PATH"
          scoop --version

      - name: Enable WinGet local manifests for WinGet validation
        if: matrix.channel == 'WinGet'
        shell: pwsh
        run: winget settings --enable LocalManifestFiles

      - name: Download current-run distribution binaries
        uses: actions/download-artifact@v8
        with:
          name: wright-dist-cli-${{ matrix.os }}
          path: target/debug

      - name: Verify current-run distribution build identity
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg revision "${GITHUB_SHA}" \
            --arg runner_os "${RUNNER_OS}" \
            '(.revision == $revision) and
             (.runner_os == $runner_os) and
             (.toolchain == "stable") and
             (.profile == "dev") and
             (.packages == ["wright-cli", "wright-lsp"])' \
            target/debug/wright-dist.build.json >/dev/null
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            chmod +x target/debug/wright target/debug/wright-lsp
          fi

      - name: Validate package-manager metadata and install script
        run: python scripts/verify-dist.py

      - name: Run install.sh functional tests
        if: matrix.channel == 'install.sh'
        run: scripts/test-install.sh
      - name: Run install.sh native channel smoke
        if: matrix.channel == 'install.sh'
        run: python scripts/test-distribution-install-sh.py
      - name: Run install.ps1 channel validation
        if: matrix.channel == 'install.ps1'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Run install.ps1 production R2 smoke
        if: matrix.channel == 'install.ps1'
        shell: pwsh
        run: ./scripts/test-install-r2.ps1
      - name: Run Homebrew channel validation
        if: matrix.channel == 'Homebrew'
        run: python scripts/test-distribution-homebrew.py
      - name: Run Scoop channel validation
        if: matrix.channel == 'Scoop'
        run: python scripts/test-distribution-scoop.py
      - name: Run WinGet channel validation
        if: matrix.channel == 'WinGet'
        run: python scripts/test-distribution-winget.py
