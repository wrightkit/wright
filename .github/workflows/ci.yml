name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  compatibility-oracle:
    name: OverPy compatibility oracle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: compatibility/oracle/pnpm-lock.yaml

      - name: Install pinned OverPy oracle
        run: pnpm install --frozen-lockfile
        working-directory: compatibility/oracle

      - name: Test compatibility runner
        run: python3 -m unittest discover -s compatibility/tests

      - name: Run compatibility oracle
        run: python3 compatibility/run_oracle.py

  compatibility-differential:
    name: Wright differential compatibility
    if: ${{ vars.WRIGHT_COMPAT_COMMAND != '' }}
    runs-on: ubuntu-latest
    needs: compatibility-oracle
    env:
      WRIGHT_COMPAT_COMMAND: ${{ vars.WRIGHT_COMPAT_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Wright differential comparison
        run: |
          python3 compatibility/diff.py \
            --wright-command "$WRIGHT_COMPAT_COMMAND" \
            --report compatibility/report.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-report
          path: compatibility/report.json
