name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      lpp: ${{ steps.classify.outputs.lpp }}
      v1: ${{ steps.classify.outputs.v1 }}
      overpy_oracle: ${{ steps.classify.outputs.overpy_oracle }}
      ostw_reference: ${{ steps.classify.outputs.ostw_reference }}
      ostw_diff: ${{ steps.classify.outputs.ostw_diff }}
      adapter: ${{ steps.classify.outputs.adapter }}
      opy_diff: ${{ steps.classify.outputs.opy_diff }}
      dist: ${{ steps.classify.outputs.dist }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          emit_all() {
            for key in rust lpp v1 overpy_oracle ostw_reference ostw_diff adapter opy_diff dist; do
              echo "$key=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            emit_all
            exit 0
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          printf '%s\n' "$files"

          if grep -Eq '^\.github/workflows/ci\.yml$' <<< "$files"; then
            emit_all
            exit 0
          fi

          match() {
            grep -Eq "$1" <<< "$files"
          }
          output() {
            local key="$1"
            local pattern="$2"
            if match "$pattern"; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          }

          workspace='^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
          output rust "$workspace"
          output lpp "$workspace"
          output v1 '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(v1-gates\.py|run-scenarios\.py)$|scenarios/)'
          output overpy_oracle '^compatibility/(oracle/|tests/|run_oracle\.py$|fixtures/)'
          output ostw_reference '^compatibility/ostw/'
          output ostw_diff '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|compatibility/ostw/)'
          output adapter '^adapter/'
          output opy_diff '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|compatibility/)'
          output dist '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|dist/|install\.sh$|scripts/(verify-dist\.py|test-install\.sh|test-npm\.py)$)'

  rust-quality:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust quality (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          rustflags: ""
          cache-shared-key: linux-quality
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  lpp-client-integration:
    needs: changes
    if: needs.changes.outputs.lpp == 'true'
    name: LPP client integration (#142, #139)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-shared-key: linux-quality
          cache-save-if: false
          cache-on-failure: false

      # The mock provider is built from the pinned language-provider-protocol
      # commit the integration tests were validated against (merged LPP v1,
      # PR wrightkit/language-provider-protocol#2 plus docs-only follow-ups).
      - name: Check out language-provider-protocol (pinned)
        uses: actions/checkout@v7
        with:
          repository: wrightkit/language-provider-protocol
          ref: 416b293e26e6fb2d29061608a493a7aecd2ce14f
          path: language-provider-protocol

      - name: Build the pinned LPP mock provider
        run: cargo build -p lpp-mock-provider
        working-directory: language-provider-protocol

      # REQUIRED: these suites self-skip when LPP_MOCK_PROVIDER is absent,
      # so the variable must be set here for them to run at all.
      - name: Run LPP client integration tests (required)
        env:
          LPP_MOCK_PROVIDER: ${{ github.workspace }}/language-provider-protocol/target/debug/lpp-mock-provider
        run: |
          cargo test -p wright-lpp --test mock_provider
          cargo test -p wright-driver --test lpp
          cargo test -p wright-driver --test provider_edit

  v1-gates:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    name: v1 release gates (N-level, scenarios, benchmarks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-shared-key: linux-quality
          cache-save-if: false
          cache-on-failure: false

      - name: Build wright (debug)
        run: cargo build -p wright-cli -p wright-bench

      - name: Run N-level gate
        run: python3 scripts/v1-gates.py

      - name: Run E-level scenarios
        run: python3 scripts/run-scenarios.py

      - name: Run benchmarks
        run: cargo run -p wright-bench

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1-gate-reports
          path: |
            target/v1-gates-report.json
            target/scenarios-report.json
            target/wright-bench-report.json

  compatibility-oracle:
    needs: changes
    if: needs.changes.outputs.overpy_oracle == 'true'
    name: OverPy compatibility oracle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: compatibility/oracle/pnpm-lock.yaml

      - name: Install pinned OverPy oracle
        run: pnpm install --frozen-lockfile
        working-directory: compatibility/oracle

      - name: Test compatibility runner
        run: python3 -m unittest discover -s compatibility/tests

      - name: Run compatibility oracle
        run: python3 compatibility/run_oracle.py

  ostw-reference:
    needs: changes
    if: needs.changes.outputs.ostw_reference == 'true'
    name: OSTW reference baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify pinned OSTW oracle and corpus evidence
        run: |
          python3 compatibility/ostw/run_oracle.py --acquire --ping
          python3 compatibility/ostw/run_oracle.py

  ostw-compile-differential:
    needs: changes
    if: needs.changes.outputs.ostw_diff == 'true'
    name: OSTW compile differential (#119)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-shared-key: linux-quality
          cache-save-if: false
          cache-on-failure: false

      - name: Run OSTW forward-compilation differential suite
        run: cargo test -p wright-ostw --test differential

      - name: Upload differential report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wright-ostw-differential-report
          path: target/wright-ostw-differential-report.json

  adapter:
    needs: changes
    if: needs.changes.outputs.adapter == 'true'
    name: OverPy-to-HIR adapter
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: adapter/pnpm-lock.yaml

      - name: Install adapter dependencies
        run: pnpm install --frozen-lockfile
        working-directory: adapter

      - name: Run adapter tests
        run: pnpm test
        working-directory: adapter

  compatibility-differential:
    needs: changes
    if: needs.changes.outputs.opy_diff == 'true'
    name: Native-vs-reference frontend differential
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-shared-key: linux-quality
          cache-save-if: false
          cache-on-failure: false

      - name: Run native-vs-reference differential suite
        run: cargo test -p wright-opy --test differential

      - name: Upload differential report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wright-differential-report
          path: target/wright-differential-report.json

  dist-validation:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    name: Distribution validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-targets: false
          cache-bin: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build wright CLI and LSP
        run: cargo build -p wright-cli -p wright-lsp

      - name: Validate package-manager metadata and install script
        run: python scripts/verify-dist.py

      - name: Run installer functional tests
        if: runner.os != 'Windows'
        run: scripts/test-install.sh

      - name: Run npm distribution smoke tests
        run: python scripts/test-npm.py --binaries-dir target/debug
