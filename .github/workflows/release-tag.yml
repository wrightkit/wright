name: Release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create and push release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache: false

      - name: Update version, commit, and push the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git pull --ff-only origin main

          VERSION="$INPUT_VERSION"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "invalid version '$VERSION' (expected semver like 0.1.0)"; exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists on origin"; exit 1
          fi

          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wright-cli"))')"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          path = Path("Cargo.toml")
          text = path.read_text()
          pattern = re.compile(r"(?ms)^(\[workspace\.package\]\n.*?^version = )\"[^\"]+\"")
          updated, count = pattern.subn(lambda match: f'{match.group(1)}"{version}"', text, count=1)
          if count != 1:
              raise SystemExit("expected exactly one [workspace.package] version")
          path.write_text(updated)
          PY

          fi

          python3 scripts/update-dist-manifests.py --version "$VERSION"
          python3 scripts/verify-dist.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml dist
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $VERSION"
            git push origin HEAD:main
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pushed version commit and tag v$VERSION"

      - name: Trigger the release workflow
        run: gh workflow run release.yml --ref main -f version="${{ steps.tag.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
