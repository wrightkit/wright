name: Release publication

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: wright-release-publication
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Select release candidate
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      commit: ${{ steps.candidate.outputs.commit }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Check out the exact CI revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Identify release-please candidate
        id: candidate
        run: >-
          python3 scripts/verify-release-candidate.py
          --commit "${{ github.event.workflow_run.head_sha }}"
          --output "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: release-candidate
    if: needs.release-candidate.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release-candidate.outputs.commit }}
      tag: ${{ needs.release-candidate.outputs.tag }}
      commit: ${{ needs.release-candidate.outputs.commit }}
    secrets: inherit
    permissions:
      actions: read
      contents: write
