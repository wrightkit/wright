name: Release-please

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Maintain Wright release
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_commit: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Synchronize checked-in release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PR: ${{ steps.release.outputs.pr }}
        run: ./scripts/sync-release-metadata.sh

  release-artifacts:
    name: Build and publish release artifacts
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release.outputs.release_commit }}
      tag: ${{ needs.release.outputs.release_tag }}
      commit: ${{ needs.release.outputs.release_commit }}
    secrets: inherit
    permissions:
      actions: read
      contents: write
