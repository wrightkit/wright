name: Release-please

# Both the tag and the lockfile push use GH_TOKEN: pushes made with the
# built-in GITHUB_TOKEN do not trigger workflows, so the Release PR would get
# no CI and the tag would not start release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out Release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Rust
        if: steps.release.outputs.prs_created == 'true'
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.97.1

      - name: Synchronize Cargo.lock
        if: steps.release.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): synchronize Cargo.lock" -- Cargo.lock
          git push
