name: Refresh owner CI pin

on:
  push:
    branches:
      - chore/issue-314-owner-releases

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/issue-314-owner-releases
      - name: Update released Workshop corpus pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = 'ref: 4a9f2dae36c47d50b8396563dd42cb9c750106ec # v0.3.9'
          new = 'ref: 4893309e09f9614e8534c6ab94348be7a143a2de # v0.3.10'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old corpus pin, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - name: Commit updated evidence pin
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m "ci: update released Workshop corpus pin"
          git push origin HEAD:chore/issue-314-owner-releases
