name: Refresh owner lockfile

on:
  push:
    branches:
      - chore/issue-314-owner-releases

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/issue-314-owner-releases
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Resolve released owner dependencies
        run: |
          set -euo pipefail
          cargo update -p opy-rs --precise 0.1.38
          cargo update -p workshop-rs --precise 0.3.10
          git diff --check
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: refresh owner dependency lockfile"
          git push origin HEAD:chore/issue-314-owner-releases
