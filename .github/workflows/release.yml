name: Release

# ---------------------------------------------------------------------------
# Trigger rules
# ---------------------------------------------------------------------------
# Runs only when the CI workflow completes for a push to main.
# detect-release gates on CI success and verifies the triggering run came
# from a trusted push event on this repository before checking out or
# executing any content from the triggering SHA.
#
# This replaces the previous approach where release-please dispatched this
# workflow directly and a polling job waited for CI to finish. CI success is
# now a native prerequisite expressed through the Actions graph.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # [0] DETECT RELEASE
  # Trust boundary: verifies the triggering CI run was a push event from this
  # repository (not a fork PR whose head branch is named main) before checking
  # out the SHA or advancing to any privileged job. Also gates on CI success
  # so a failed CI run can never advance to publication.
  #
  # Checks whether the triggering commit is a release commit by comparing
  # version.txt at that SHA against existing published tags. Skips all
  # downstream jobs when the commit is not a new release.
  # -------------------------------------------------------------------------
  detect-release:
    name: Detect release commit
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_commit: ${{ steps.check.outputs.release_commit }}
    steps:
      - name: Check out repository at CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine whether this is a release commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          tag="v${version}"
          echo "Candidate release: ${tag} at ${CI_COMMIT}"

          # Check whether a Release for this tag already exists.
          # A published (non-draft) Release means this version is complete; skip.
          # A draft Release may mean a previous upload-artifacts run started but
          # failed partway. Only resume if the draft targets the current CI commit;
          # a stale draft from a different commit must not be silently adopted.
          existing="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,targetCommitish 2>/dev/null || true)"
          if [[ -n "${existing}" ]]; then
            is_draft="$(echo "${existing}" | python3 -c \
              "import sys,json; r=json.load(sys.stdin); print(str(r.get('isDraft',False)).lower())")"
            if [[ "${is_draft}" == "false" ]]; then
              echo "Published Release ${tag} already exists; skipping."
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Resolve targetCommitish to a SHA (it may be a branch name).
            target_ref="$(echo "${existing}" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('targetCommitish',''))")"
            draft_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target_ref}" \
              --jq '.sha' 2>/dev/null || true)"
            if [[ "${draft_sha}" != "${CI_COMMIT}" ]]; then
              echo "Draft Release ${tag} targets ${draft_sha} (via '${target_ref}'), not ${CI_COMMIT}; skipping."
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Draft Release ${tag} targets ${CI_COMMIT}; resuming incomplete release pipeline."
          fi

          # Confirm the commit message matches a release-please merge pattern.
          commit_subject="$(git log -1 --format='%s' "${CI_COMMIT}")"
          if [[ "$commit_subject" != "chore(main): release "* ]]; then
            echo "Commit subject '${commit_subject}' is not a release commit."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Confirmed release commit: ${tag} at ${CI_COMMIT}"
          echo "is_release=true"   >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_commit=${CI_COMMIT}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # [1] RELEASE IDENTITY
  # Verifies the release commit's workspace version matches the derived tag.
  # Runs only when detect-release confirms a new release commit.
  # -------------------------------------------------------------------------
  release-identity:
    name: Verify release identity and packages
    needs: detect-release
    if: needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.detect-release.outputs.release_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Verify workspace version matches tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          tag="v${version}"
          if [[ "$tag" != "$RELEASE_TAG" ]]; then
            echo "version.txt (${version}) does not match expected tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='wright-cli'))")"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Cargo workspace version (${cargo_version}) does not match version.txt (${version})" >&2
            exit 1
          fi
          echo "Release identity verified: ${RELEASE_TAG} at ${RELEASE_COMMIT}"

      - name: Verify checked-in distribution metadata
        run: python3 scripts/verify-dist.py

  # -------------------------------------------------------------------------
  # [2] BUILD
  # Native release builds per target. Depends on release-identity so a
  # version mismatch aborts before building.
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs:
      - detect-release
      - release-identity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.detect-release.outputs.release_commit }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore release dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-stable-release
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Build release binaries
        run: cargo build --locked --release -p wright-cli -p wright-lsp --target "$TARGET"

      - name: Package archive with version stamp
        run: >-
          python scripts/package-release.py
          --version "${{ needs.detect-release.outputs.release_tag }}"
          --target "$TARGET"
          --extension "$EXT"
          --commit "${{ needs.detect-release.outputs.release_commit }}"
          --runner-os "${{ runner.os }}"

      - name: Smoke test the packaged archive
        run: >-
          python scripts/smoke-release-archive.py
          --archive "dist/wright-${RELEASE_TAG#v}-${TARGET}.${EXT}"
          --version "$RELEASE_TAG"
          --target "$TARGET"
          --extension "$EXT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wright-${{ matrix.target }}
          path: |
            dist/wright-*.tar.gz
            dist/wright-*.tar.gz.sha256
            dist/wright-*.zip
            dist/wright-*.zip.sha256
            dist/wright-*.build.json

  # -------------------------------------------------------------------------
  # [3] UPLOAD ARTIFACTS
  # Verifies the complete artifact set and checksums, creates the release tag
  # and a draft GitHub Release, then attaches native archives.
  # The Release is kept as a draft here so that a failure in the subsequent
  # package-manifests job cannot leave a public incomplete Release.
  # Final publication to non-draft happens in publish-release after all
  # release-specific artifact and manifest gates have succeeded.
  # -------------------------------------------------------------------------
  upload-artifacts:
    name: Upload native release artifacts
    needs:
      - detect-release
      - release-identity
      - build
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.detect-release.outputs.release_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-release.outputs.release_commit }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wright-*
          path: artifacts
          merge-multiple: true

      - name: Verify the complete artifact set
        run: >-
          python3 scripts/verify-release-artifacts.py
          --version "${{ needs.detect-release.outputs.release_tag }}"
          --commit "${{ needs.detect-release.outputs.release_commit }}"
          --tag "${{ needs.detect-release.outputs.release_tag }}"
          --artifacts-dir artifacts
          --output-dir release

      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,targetCommitish 2>/dev/null || true)"
          if [[ -n "${existing}" ]]; then
            is_draft="$(echo "${existing}" | python3 -c \
              "import sys,json; r=json.load(sys.stdin); print(str(r.get('isDraft',False)).lower())")"
            if [[ "${is_draft}" != "true" ]]; then
              echo "A published Release ${RELEASE_TAG} already exists; cannot overwrite." >&2
              exit 1
            fi
            # targetCommitish may be a branch name; resolve it to a SHA before
            # comparing to RELEASE_COMMIT to enforce the exact-SHA identity contract.
            target_ref="$(echo "${existing}" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('targetCommitish',''))")"
            draft_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target_ref}" \
              --jq '.sha' 2>/dev/null || true)"
            if [[ "${draft_sha}" != "${RELEASE_COMMIT}" ]]; then
              echo "Draft Release ${RELEASE_TAG} targets ${draft_sha} (via '${target_ref}'), expected ${RELEASE_COMMIT}." >&2
              echo "Stale or mismatched draft; delete it manually before rerunning." >&2
              exit 1
            fi
            echo "Reusing draft Release ${RELEASE_TAG} targeting ${RELEASE_COMMIT}."
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_COMMIT}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --draft
            echo "Created draft Release ${RELEASE_TAG}."
          fi

      - name: Attach native archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${RELEASE_TAG}" release/* --clobber
          --repo "${GITHUB_REPOSITORY}"

  # -------------------------------------------------------------------------
  # [4] PACKAGE MANIFESTS
  # Generates package-manager manifests from verified checksums and attaches
  # them to the draft Release. Runs before publication so that the published
  # Release contains the complete artifact and manifest set.
  # -------------------------------------------------------------------------
  package-manifests:
    name: Generate package-manager manifests
    needs:
      - detect-release
      - upload-artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wright-*
          path: artifacts
          merge-multiple: true

      - name: Generate manifests from the published checksums
        run: >-
          python3 scripts/generate-release-manifests.py
          --version "${{ needs.detect-release.outputs.release_tag }}"
          --artifacts-dir artifacts
          --output-dir manifests
          --attach-dir attach

      - name: Upload Homebrew formula for tap publication
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: ${{ github.workspace }}/manifests/dist/homebrew/wright.rb
          if-no-files-found: error

      - name: Attach package-manager manifests to the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${RELEASE_TAG}" attach/* --clobber
          --repo "${GITHUB_REPOSITORY}"

  # -------------------------------------------------------------------------
  # [5] PUBLISH RELEASE
  # Promotes the draft GitHub Release to public --latest only after all
  # artifact and package-manifest gates have succeeded. R2 and Homebrew
  # publication are downstream of this boundary.
  # -------------------------------------------------------------------------
  publish-release:
    name: Publish completed GitHub Release
    needs:
      - detect-release
      - package-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Publish the completed draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
        run: >-
          gh release edit "${RELEASE_TAG}" --draft=false --latest
          --repo "${GITHUB_REPOSITORY}"

  # -------------------------------------------------------------------------
  # [6] PUBLISH TAP
  # Publishes the Homebrew formula to wrightkit/homebrew-tap after the
  # GitHub Release is publicly published.
  # -------------------------------------------------------------------------
  publish-tap:
    name: Publish formula to homebrew-tap
    needs:
      - detect-release
      - package-manifests
      - publish-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-release.outputs.release_commit }}

      - name: Download generated Homebrew formula
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: formula

      - name: Check out wrightkit/homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: wrightkit/homebrew-tap
          ref: main
          # Only this cross-repository tap operation uses secrets.GH_TOKEN.
          token: ${{ secrets.GH_TOKEN }}
          path: tap

      - name: Update wright.rb and push to the tap
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/publish-homebrew-tap.sh

  # -------------------------------------------------------------------------
  # [7] PUBLISH R2
  # Publishes verified archives to Cloudflare R2 after the GitHub Release
  # is publicly published.
  # -------------------------------------------------------------------------
  publish-r2:
    name: Publish verified archives to R2
    needs:
      - detect-release
      - upload-artifacts
      - publish-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.detect-release.outputs.release_tag }}
      R2_BUCKET: wrightkit-release
      R2_PUBLIC_BASE_URL: https://releases.wrightkit.dev
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-release.outputs.release_commit }}

      - name: Check R2 publication configuration
        run: aws --version

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wright-*
          path: artifacts
          merge-multiple: true

      - name: Publish immutable versioned objects, then advance latest
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/publish-r2.sh
