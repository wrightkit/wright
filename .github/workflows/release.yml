name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: Git revision containing the release packages
        required: true
        type: string
      tag:
        description: Release tag to create after all release gates pass
        required: true
        type: string
      commit:
        description: Release commit used for version identity
        required: true
        type: string
    secrets:
      GH_TOKEN:
        description: Dedicated cross-repository token with write access to wrightkit/homebrew-tap
        required: true
      R2_ACCESS_KEY_ID:
        description: Cloudflare R2 S3 API access key with write access to the release bucket
        required: true
      R2_SECRET_ACCESS_KEY:
        description: Cloudflare R2 S3 API secret key with write access to the release bucket
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account ID for the R2 S3 API endpoint
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release-identity:
    name: Verify release identity and packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Verify release revision and version identity
        run: >-
          python3 scripts/verify-release-identity.py
          --tag "${{ inputs.tag }}"
          --commit "${{ inputs.commit }}"
          --ref "${{ inputs.ref }}"

      - name: Verify checked-in distribution metadata
        run: python3 scripts/verify-dist.py

  build:
    name: Build ${{ matrix.target }}
    needs: release-identity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore release dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-stable-release
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Build release binaries
        run: cargo build --locked --release -p wright-cli -p wright-lsp --target "$TARGET"

      - name: Package archive with version stamp
        run: >-
          python scripts/package-release.py
          --version "${{ inputs.tag }}"
          --target "$TARGET"
          --extension "$EXT"
          --commit "${{ inputs.commit }}"
          --runner-os "${{ runner.os }}"

      - name: Smoke test the packaged archive
        run: >-
          python scripts/smoke-release-archive.py
          --archive "dist/wright-${RELEASE_TAG#v}-${TARGET}.${EXT}"
          --version "$RELEASE_TAG"
          --target "$TARGET"
          --extension "$EXT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wright-${{ matrix.target }}
          path: |
            dist/wright-*.tar.gz
            dist/wright-*.tar.gz.sha256
            dist/wright-*.zip
            dist/wright-*.zip.sha256
            dist/wright-*.build.json

  upload-artifacts:
    name: Upload native release artifacts
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wright-*
          path: artifacts
          merge-multiple: true

      - name: Verify the complete artifact set
        run: >-
          python3 scripts/verify-release-artifacts.py
          --version "${{ inputs.tag }}"
          --commit "${{ inputs.commit }}"
          --tag "${{ inputs.tag }}"
          --artifacts-dir artifacts
          --output-dir release

      - name: Upload verified native release assets
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: release/*
          if-no-files-found: error

  package-manifests:
    name: Generate package-manager manifests
    needs: upload-artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wright-*
          path: artifacts
          merge-multiple: true

      - name: Generate manifests from the published checksums
        run: >-
          python3 scripts/generate-release-manifests.py
          --version "${{ inputs.tag }}"
          --artifacts-dir artifacts
          --output-dir manifests
          --attach-dir attach

      - name: Upload verified package-manager manifests
        uses: actions/upload-artifact@v7
        with:
          name: release-manifests
          path: attach/*
          if-no-files-found: error

  publish-tap:
    name: Publish formula to homebrew-tap
    needs:
      - package-manifests
      - publish-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Download generated Homebrew formula
        uses: actions/download-artifact@v8
        with:
          name: release-manifests
          path: formula

      - name: Check out wrightkit/homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: wrightkit/homebrew-tap
          ref: main
          # Only this cross-repository tap operation uses secrets.GH_TOKEN.
          token: ${{ secrets.GH_TOKEN }}
          path: tap

      - name: Update wright.rb and push to the tap
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/publish-homebrew-tap.sh

  publish-release:
    name: Publish completed GitHub Release
    needs:
      - upload-artifacts
      - package-manifests
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Download verified native release assets
        uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: release

      - name: Download verified package-manager manifests
        uses: actions/download-artifact@v8
        with:
          name: release-manifests
          path: attach

      - name: Create or verify the completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          existing_tag_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
            --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_tag_commit" && \
            "$existing_tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "tag $RELEASE_TAG already points to $existing_tag_commit" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$draft" != "false" ]]; then
              echo "existing release $RELEASE_TAG is still a draft" >&2
              exit 1
            fi
            echo "verified existing public release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" release/* attach/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "Wright $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

          python3 scripts/verify-release-identity.py \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ref "$RELEASE_COMMIT" \
            --verify-tag

          published_assets="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')"
          for path in release/* attach/*; do
            asset="$(basename "$path")"
            grep -Fx -- "$asset" <<<"$published_assets" >/dev/null || {
              echo "release $RELEASE_TAG is missing asset $asset" >&2
              exit 1
            }
          done

  publish-r2:
    name: Publish verified archives to R2
    needs:
      - upload-artifacts
      - publish-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      R2_BUCKET: wrightkit-release
      R2_PUBLIC_BASE_URL: https://releases.wrightkit.dev
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Check R2 publication configuration
        run: aws --version

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: artifacts

      - name: Publish immutable versioned objects, then advance latest
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/publish-r2.sh
