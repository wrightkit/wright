name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish (nightly or stable)
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish (stable only)
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  # Stable runs serialize so concurrent releases cannot interleave `latest`
  # promotion; a pending run is replaced by a newer one. Nightly keeps its
  # single group and cancels in-progress runs.
  group: ${{ (github.event_name == 'push' || inputs.channel == 'stable') && 'wright-stable' || 'wright-nightly' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || inputs.channel == 'nightly' }}

jobs:
  release-identity:
    name: Resolve release identity
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve channel, tag, and revision
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
          WORKFLOW_RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag=
          case "$EVENT_NAME" in
            push)
              channel=stable
              tag="$PUSHED_TAG"
              ;;
            workflow_dispatch)
              channel="$REQUESTED_CHANNEL"
              tag="$REQUESTED_TAG"
              ;;
            workflow_run)
              channel=nightly
              ;;
            *)
              echo "unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$channel" == stable ]]; then
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "stable releases need a vMAJOR.MINOR.PATCH tag: '$tag'" >&2
              exit 1
            fi
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
          else
            if [[ -n "$tag" ]]; then
              echo "nightly releases do not accept a tag input" >&2
              exit 1
            fi
            if [[ "$EVENT_NAME" == workflow_run ]]; then
              commit="$WORKFLOW_RUN_COMMIT"
            else
              if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                echo "nightly releases must be dispatched from $DEFAULT_BRANCH" >&2
                exit 1
              fi
              commit="$GITHUB_SHA"
            fi
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
            if [[ "$current_sha" != "$commit" ]]; then
              echo "nightly commit $commit is stale; $DEFAULT_BRANCH is now $current_sha" >&2
              exit 1
            fi
            tag="nightly-${commit:0:12}"
          fi
          {
            echo "channel=$channel"
            echo "commit=$commit"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      # Nightly is already CI-gated by its workflow_run trigger; stable needs
      # the same-revision gate here because nothing else in the workflow proves
      # the tagged revision passed the required checks.
      - name: Require CI success on the release revision
        if: steps.resolve.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
          REQUIRED_CHECKS: CI result
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 5400 ))
          pending_file="$(mktemp)"
          trap 'rm -f "$pending_file"' EXIT
          if [ "$REQUIRED_CHECKS" != "${REQUIRED_CHECKS//$'\n'/,}" ]; then
            echo "REQUIRED_CHECKS must be a single comma-separated line" >&2
            exit 1
          fi
          IFS=',' read -r -a names <<< "$REQUIRED_CHECKS"
          count=0
          for raw in "${names[@]}"; do
            name="$(echo "$raw" | xargs)"
            if [ -n "$name" ]; then
              printf '%s\n' "$name" >> "$pending_file"
              count=$(( count + 1 ))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "REQUIRED_CHECKS resolved to an empty set; refusing to publish" >&2
            exit 1
          fi
          while [ -s "$pending_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for release-revision checks:" >&2
              cat "$pending_file" >&2
              exit 1
            fi
            sleep 30
            keep=""
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              if ! out="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/check-runs" \
                -f "check_name=$name" \
                --jq '(.check_runs | sort_by(.id) | last) // {status: "missing", conclusion: "", html_url: ""} | "\(.status) \(.conclusion // "-") \(.html_url // "-")"' 2>&1)"; then
                echo "check-runs API call failed for '$name': $out" >&2
                exit 1
              fi
              status="${out%% *}"
              rest="${out#* }"
              conclusion="${rest%% *}"
              case "$status" in
                completed)
                  if [ "$conclusion" = "success" ]; then
                    echo "PASS $name"
                  else
                    echo "FAIL $name concluded '$conclusion' ($out)" >&2
                    exit 1
                  fi ;;
                *)
                  keep="${keep}${name}"$'\n'
                  echo "WAIT $name ($status)" ;;
              esac
            done < "$pending_file"
            printf '%s' "$keep" > "$pending_file"
          done
          echo "All required checks succeeded on $RELEASE_COMMIT"

      # Stable runs serialize through the `wright-stable` concurrency group, so
      # this check runs inside the serialized section: an older tag pushed after
      # a newer release cannot regress `latest`.
      - name: Guard latest promotion order
        if: steps.resolve.outputs.channel == 'stable'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          http_code="$(curl --http2 --silent --show-error --location \
            -o "$body" -w '%{http_code}' \
            https://releases.wrightkit.dev/wright/latest/version)"
          if [ "$http_code" = 404 ]; then
            echo "no published latest version; $version becomes the first"
            exit 0
          fi
          if [ "$http_code" != 200 ]; then
            echo "cannot read wright/latest/version (HTTP $http_code); refusing to promote" >&2
            exit 1
          fi
          current="$(tr -d '[:space:]' < "$body")"
          lowest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | head -n1)"
          if [ "$lowest" = "$version" ] && [ "$current" != "$version" ]; then
            echo "refusing to publish $RELEASE_TAG: published latest is $current" >&2
            exit 1
          fi
          echo "latest guard passed: $version >= $current"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.commit }}

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.97.1

      - name: Verify release identity
        id: identity
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.resolve.outputs.channel }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "wright-cli") | .version')"
          if [[ -z "$version" || "$version" == null ]]; then
            echo "wright-cli workspace version is unavailable" >&2
            exit 1
          fi
          checked_in_version="$(tr -d '\r\n' < version.txt)"
          if [[ "$checked_in_version" != "$version" ]]; then
            echo "version.txt '$checked_in_version' does not match workspace version '$version'" >&2
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == stable && "$RELEASE_TAG" != "v$version" ]]; then
            echo "tag $RELEASE_TAG does not match workspace version $version" >&2
            exit 1
          fi
          {
            echo "channel=$RELEASE_CHANNEL"
            echo "commit=$RELEASE_COMMIT"
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: release-identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    defaults:
      run:
        shell: bash
    env:
      RELEASE_CHANNEL: ${{ needs.release-identity.outputs.channel }}
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: >-
          cargo build --locked --release -p wright-cli -p wright-lsp
          --target "$TARGET"

      - name: Package release archive
        run: >-
          python scripts/package-release.py
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --target "$TARGET"
          --extension "$EXT"
          --commit "$RELEASE_COMMIT"
          --runner-os "${{ runner.os }}"

      - name: Smoke test release archive
        run: >-
          python scripts/smoke-release-archive.py
          --archive "dist/wright-${RELEASE_VERSION}-${TARGET}.${EXT}"
          --version "$RELEASE_VERSION"
          --target "$TARGET"
          --extension "$EXT"

      - name: Upload target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wright-${{ matrix.target }}
          path: |
            dist/wright-*.tar.gz
            dist/wright-*.tar.gz.sha256
            dist/wright-*.zip
            dist/wright-*.zip.sha256
            dist/wright-*.build.json

  core-package:
    name: Package @wrightkit/core
    needs:
      - release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install release tooling dependencies
        run: npm ci --prefix scripts

      - name: Build the wasm core
        run: >-
          cargo build --locked --release
          --target wasm32-unknown-unknown -p wright-wasm --lib

      - name: Pack @wrightkit/core
        run: >-
          node scripts/package-core.ts
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"

      - name: Smoke check the packed core
        run: >-
          node scripts/smoke-core-package.ts
          --tarball "dist/wrightkit-core-${RELEASE_VERSION}.tgz"

      - name: Upload core package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wright-core-package
          path: dist/wrightkit-core-*
          if-no-files-found: error

  release-assets:
    name: Verify native release artifacts
    needs:
      - release-identity
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-identity.outputs.commit }}

      - name: Download target artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wright-*-*-*
          path: release
          merge-multiple: true

      - name: Verify archives and identities
        shell: bash
        run: |
          set -euo pipefail
          expected_toolchain="$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)"
          mkdir verified
          for spec in \
            x86_64-unknown-linux-gnu:tar.gz \
            x86_64-apple-darwin:tar.gz \
            aarch64-apple-darwin:tar.gz \
            x86_64-pc-windows-msvc:zip; do
            IFS=: read -r target extension <<< "$spec"
            archive="release/wright-$RELEASE_VERSION-$target.$extension"
            checksum="$archive.sha256"
            identity="$archive.build.json"
            test -f "$archive"
            test -f "$checksum"
            test -f "$identity"
            expected_hash="$(awk 'NR == 1 { print $1 }' "$checksum")"
            actual_hash="$(sha256sum "$archive" | awk 'NR == 1 { print $1 }')"
            test "$actual_hash" = "$expected_hash"
            jq -e \
              --arg revision "$RELEASE_COMMIT" \
              --arg tag "$RELEASE_TAG" \
              --arg target "$target" \
              --arg expected_toolchain "$expected_toolchain" \
              '.revision == $revision and
               .tag == $tag and
               .target == $target and
               .toolchain == $expected_toolchain and
               .profile == "release" and
               .packages == ["wright-cli", "wright-lsp"] and
               .features == []' "$identity" >/dev/null
            cp "$archive" "$checksum" verified/
          done
          (cd verified && sha256sum wright-*.tar.gz wright-*.zip > SHA256SUMS)

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-assets
          path: verified/*
          if-no-files-found: error

  package-manifests:
    name: Generate package-manager manifests
    needs:
      - release-identity
      - release-assets
    if: needs.release-identity.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: artifacts

      - name: Generate package manifests
        run: >-
          python3 scripts/generate-release-manifests.py
          --version "$RELEASE_VERSION"
          --artifacts-dir artifacts
          --output-dir manifests
          --attach-dir attach

      - name: Upload package manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifests
          path: attach/*
          if-no-files-found: error

  release-metrics:
    name: Generate agent-facing metrics
    needs:
      - release-identity
      - release-assets
    if: needs.release-identity.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.97.1
      # Deliberate distinct identity: the metrics CLI needs plain wright-cli
      # while `build` ships --features wright-cli/ui — a different binary, so
      # this job keeps its own release build.
      - name: Build wright
        run: cargo build --locked --release -p wright-cli
      - name: Install OPY provider
        run: target/release/wright update provider opy
      - name: Generate agent-facing metrics
        run: >-
          python3 benchmarks/metrics/metrics.py run
          --wright target/release/wright
          --out "wright-agent-metrics-$RELEASE_VERSION.json"
      - name: Upload metrics artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-metrics
          path: wright-agent-metrics-*.json
          if-no-files-found: error

  publish-tap:
    name: Publish formula to homebrew-tap
    needs:
      - release-identity
      - package-manifests
      - publish-release
    if: needs.release-identity.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}
      - name: Download Homebrew formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifests
          path: formula

      - name: Check out homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wrightkit/homebrew-tap
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: tap

      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/publish-homebrew-tap.sh

  publish-release:
    name: Publish completed GitHub Release
    needs:
      - release-identity
      - release-assets
      - package-manifests
      - publish-r2
      - release-metrics
    if: needs.release-identity.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: release

      - name: Download package manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifests
          path: attach

      - name: Download agent-facing metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-metrics
          path: attach

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
        run: |
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "tag $RELEASE_TAG points to $tag_commit, not $RELEASE_COMMIT" >&2
            exit 1
          fi

          draft="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null || true)"
          if [[ -z "$draft" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --draft
            draft=true
          elif [[ "$draft" == true ]]; then
            echo "found existing draft release $RELEASE_TAG"
          else
            echo "release $RELEASE_TAG already exists as public; refusing to continue" >&2
            exit 1
          fi

          if [[ "$draft" == true ]]; then
            gh release upload "$RELEASE_TAG" release/* attach/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft=false \
              --latest
          fi

  publish-npm:
    name: Publish @wrightkit/core to npm
    needs:
      - release-identity
      - core-package
      - publish-release
    if: needs.release-identity.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Download core package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wright-core-package
          path: package

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify core package checksum
        run: (cd package && sha256sum -c wrightkit-core-*.tgz.sha256)

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./package/wrightkit-core-*.tgz

  publish-r2:
    name: Publish ${{ needs.release-identity.outputs.channel }} distribution to R2
    needs:
      - release-identity
      - release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    if: always() && needs.release-assets.result == 'success'
    env:
      RELEASE_CHANNEL: ${{ needs.release-identity.outputs.channel }}
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
      R2_BUCKET: wrightkit-release
      R2_PUBLIC_BASE_URL: https://releases.wrightkit.dev
      R2_INSTALLER_PUBLIC_BASE_URL: https://install.wrightkit.dev
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}
      - name: Verify AWS CLI config
        run: aws --version

      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: artifacts

      - name: Publish archives to R2
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/publish-r2.sh objects

      - name: Advance nightly version pointer
        if: needs.release-identity.outputs.channel == 'nightly'
        run: ./scripts/publish-r2.sh pointer

  advance-latest:
    name: Advance wright/latest/version
    needs:
      - release-identity
      - publish-release
    if: needs.release-identity.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      RELEASE_CHANNEL: ${{ needs.release-identity.outputs.channel }}
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
      R2_BUCKET: wrightkit-release
      R2_PUBLIC_BASE_URL: https://releases.wrightkit.dev
      R2_INSTALLER_PUBLIC_BASE_URL: https://install.wrightkit.dev
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-identity.outputs.commit }}
      - name: Verify AWS CLI config
        run: aws --version

      - name: Advance stable version pointer
        run: ./scripts/publish-r2.sh pointer
