# Dependabot version updates for the Wright workspace.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust workspace: the root manifest governs all crate manifests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly

  # CI workflows and their action pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
