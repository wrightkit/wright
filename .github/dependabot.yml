# Dependabot version updates for the Wright workspace.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust workspace: the root manifest governs all crate manifests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly

  # OverPy compatibility oracle: overpy is pinned as the reference
  # implementation and changes only through an explicit compatibility
  # decision, so it is excluded from automated updates.
  - package-ecosystem: npm
    directory: /compatibility/oracle
    schedule:
      interval: monthly
    ignore:
      - dependency-name: overpy

  # OverPy-to-HIR adapter: mirrors the oracle pin for the same reason.
  - package-ecosystem: npm
    directory: /adapter
    schedule:
      interval: monthly
    ignore:
      - dependency-name: overpy

  # CI workflows and their action pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
