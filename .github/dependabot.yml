# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust workspace: the root manifest governs all crate manifests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # UI toolchain (ADR-0032): npm packages under ui/.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
