name = "wright-r2-redirect"
main = "../../scripts/r2-redirect-worker.ts"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wrightkit-release"

# Worker custom domains replace the bucket's direct custom domains; remove the
# bucket domain bindings for these hosts before deploying.
[[routes]]
pattern = "releases.wrightkit.dev"
custom_domain = true

[[routes]]
pattern = "install.wrightkit.dev"
custom_domain = true
