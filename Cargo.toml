[workspace]
members = ["crates/wright-core", "crates/wright-ir", "crates/wright-analyzer", "crates/wright-driver", "crates/wright-cli", "crates/wright-opy", "crates/wright-transform", "crates/wright-bench", "crates/wright-consumer", "crates/wright-language", "crates/wright-lsp", "crates/wright-lpp"]
resolver = "3"

[workspace.package]
version = "0.2.21"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/wrightkit/wright"

[workspace.dependencies]
# Canonical Workshop core (wright#143): the 0.1.18 release remains the shared
# WIR/parser contract for the existing provider crates. The analyzer's
# catalog-only locale contract is consumed from the released 0.3.6 catalog API.
workshop-rs = "=0.1.18"
workshop-rs-catalog = { package = "workshop-rs", version = "=0.3.6" }
opy-rs = "=0.1.18"
libc = "0.2"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls-native-roots"] }
wright-analyzer = { path = "crates/wright-analyzer" }
wright-core = { path = "crates/wright-core" }
wright-driver = { path = "crates/wright-driver" }
wright-ir = { path = "crates/wright-ir" }
wright-opy = { path = "crates/wright-opy" }
wright-transform = { path = "crates/wright-transform" }

[workspace.lints.rust]
# Unsafe operations inside an unsafe function still need an explicit block so
# the unsafe surface and its invariants remain visible at the operation site.
unsafe_op_in_unsafe_fn = "deny"
# Public items in a private module are not part of a usable crate API.
unreachable_pub = "deny"

[workspace.lints.clippy]
# These groups cover bug-prone findings without enabling broad style or
# restriction policies; CI promotes the remaining warning-level checks.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
# These development/progress macros must not reach compiler or tooling code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Reduce dependency artifact volume while retaining line-table diagnostics for
# WrightKit code. See wrightkit/.github docs/rust-build-artifacts.md.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
debug = false
