[workspace]
members = ["crates/wright-core", "crates/wright-ir", "crates/wright-analyzer", "crates/wright-workshop", "crates/wright-driver", "crates/wright-cli", "crates/wright-opy", "crates/wright-ostw", "crates/wright-transform", "crates/wright-bench", "crates/wright-consumer", "crates/wright-language", "crates/wright-lsp", "crates/wright-lpp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/wrightkit/wright"

[workspace.dependencies]
# Canonical Workshop core (wright#143): workshop-rs owns the Workshop catalog,
# parser, emitter, detection, validation, and Workshop IR. This is the single
# pinned reference for the cutover — workspace crates consume it via
# `workshop-rs.workspace = true`. The rev is pinned to the accepted workshop-rs
# v0.2 candidate; do not consume workshop-rs main headless.
workshop-rs = { git = "https://github.com/wrightkit/workshop-rs.git", rev = "7b0f8c38b9d1ee627565e8406de25293df9b4f7f" }

[workspace.lints.rust]
# Unsafe operations inside an unsafe function still need an explicit block so
# the unsafe surface and its invariants remain visible at the operation site.
unsafe_op_in_unsafe_fn = "deny"
# Public items in a private module are not part of a usable crate API.
unreachable_pub = "deny"

[workspace.lints.clippy]
# These groups cover bug-prone findings without enabling broad style or
# restriction policies; CI promotes the remaining warning-level checks.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
# These development/progress macros must not reach compiler or tooling code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
