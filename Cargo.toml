[workspace]
members = ["crates/wright-analyzer", "crates/wright-driver", "crates/wright-cli", "crates/wright-transform", "crates/wright-bench", "crates/wright-consumer", "crates/wright-language", "crates/wright-lsp", "crates/wright-lpp", "crates/wright-wasm"]
resolver = "3"

[workspace.package]
version = "0.39.2"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/wrightkit/wright"

[workspace.dependencies]
workshop-rs = "1.25.2"
serde = "1"
serde_json = "1"
yaml_serde = "0.10"
sha2 = "0.11.1"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls-native-roots"] }
wright-analyzer = { path = "crates/wright-analyzer" }
wright-driver = { path = "crates/wright-driver" }
wright-transform = { path = "crates/wright-transform" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
debug = false

