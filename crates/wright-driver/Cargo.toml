[package]
name = "wright-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's reusable compiler/session driver shared by the CLI, tool APIs, and language services."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wright-analyzer = { path = "../wright-analyzer" }
wright-core = { path = "../wright-core" }
wright-ir = { path = "../wright-ir" }
wright-lpp = { path = "../wright-lpp" }
wright-opy = { path = "../wright-opy" }
wright-ostw = { path = "../wright-ostw" }
wright-transform = { path = "../wright-transform" }
wright-workshop = { path = "../wright-workshop" }
# Single pinned reference: `[workspace.dependencies]` in the root Cargo.toml.
workshop-rs.workspace = true
workshop-rs-provider = { package = "workshop-rs", git = "https://github.com/wrightkit/workshop-rs.git", rev = "a6110e0e5e2d8167b61ae37e22f7752c8a24befc" }
