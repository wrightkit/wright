[package]
name = "wright-driver"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's reusable compiler/session driver shared by the CLI, tool APIs, and language services."

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
reqwest.workspace = true
url = "2"
percent-encoding = "2"
hotpath = "0.28"
wright-analyzer.workspace = true
wright-lpp = { path = "../wright-lpp" }
wright-transform.workspace = true
# Single released reference: `[workspace.dependencies]` in the root Cargo.toml.
workshop-rs.workspace = true

[features]
hotpath = ["hotpath/hotpath", "wright-analyzer/hotpath", "wright-transform/hotpath"]
hotpath-alloc = [
    "hotpath/hotpath-alloc",
    "wright-analyzer/hotpath-alloc",
    "wright-transform/hotpath-alloc",
]
