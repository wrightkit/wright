[package]
name = "wright-driver"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's reusable compiler/session driver shared by the CLI, tool APIs, and language services."

[lints]
workspace = true

[dependencies]
athena-sim = { git = "https://github.com/wrightkit/athena.git", tag = "v0.5.0" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
url = "2"
percent-encoding = "2"
hotpath = "0.28"
wright-analyzer.workspace = true
wright-transform.workspace = true
workshop-rs.workspace = true

# Native-only capabilities (ADR-0037 decision 5): filesystem archives,
# network fetches, and the LPP provider transport stay out of the
# WebAssembly core.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2.workspace = true
tar.workspace = true
reqwest.workspace = true
wright-lpp = { path = "../wright-lpp" }

[features]
hotpath = ["hotpath/hotpath", "wright-analyzer/hotpath", "wright-transform/hotpath"]
hotpath-alloc = [
    "hotpath/hotpath-alloc",
    "wright-analyzer/hotpath-alloc",
    "wright-transform/hotpath-alloc",
]
