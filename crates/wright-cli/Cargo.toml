[package]
name = "wright-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The primary `wright` command-line interface over the compiler/session driver."

[lints]
workspace = true

[[bin]]
name = "wright"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wright-driver = { path = "../wright-driver" }
wright-transform = { path = "../wright-transform" }
