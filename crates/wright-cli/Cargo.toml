[package]
name = "wright-cli"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The primary `wright` command-line interface over the compiler/session driver."

[lints]
workspace = true

[[bin]]
name = "wright"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
flate2 = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
ureq = "2"
wright-driver.workspace = true
wright-transform.workspace = true

[dev-dependencies]
insta = { version = "1", features = ["json"] }
jsonschema = "0.52"
wright-analyzer.workspace = true
workshop-rs.workspace = true
