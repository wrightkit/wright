[package]
name = "wright-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The primary `wright` command-line interface over the compiler/session driver."

[lints]
workspace = true

[[bin]]
name = "wright"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"
wright-driver = { path = "../wright-driver" }
wright-transform = { path = "../wright-transform" }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
jsonschema = "0.18"
