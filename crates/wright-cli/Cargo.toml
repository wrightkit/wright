[package]
name = "wright-cli"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The primary `wright` command-line interface over the compiler/session driver."

[lints]
workspace = true

[[bin]]
name = "wright"
path = "src/main.rs"

[[test]]
name = "update_provider"
path = "tests/update/provider.rs"

[dependencies]
arboard = { version = "3.6", default-features = false }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
flate2 = "1"
rustix = { version = "1.1", features = ["termios"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tar = "0.4"
reqwest.workspace = true
wright-driver.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.59", default-features = false }
wright-analyzer.workspace = true
workshop-rs.workspace = true

[target."cfg(windows)".dependencies]
self-replace = "1.5.0"
