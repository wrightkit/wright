[package]
name = "wright-language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's editor-neutral language services: documents, diagnostics, hover, definition, references, completion, rename, semantic tokens."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wright-analyzer = { path = "../wright-analyzer" }
wright-core = { path = "../wright-core" }
wright-driver = { path = "../wright-driver" }
wright-ir = { path = "../wright-ir" }
wright-opy = { path = "../wright-opy" }
wright-ostw = { path = "../wright-ostw" }
# Single pinned reference: `[workspace.dependencies]` in the root Cargo.toml.
workshop-rs.workspace = true

[dev-dependencies]
libc = "0.2"
