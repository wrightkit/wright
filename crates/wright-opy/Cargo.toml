[package]
name = "wright-opy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's native .opy frontend: lexer, CST/parser, preprocessing, semantic resolution, and HIR lowering."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wright-core = { path = "../wright-core" }
wright-ir = { path = "../wright-ir" }
wright-workshop = { path = "../wright-workshop" }
# Single pinned reference: `[workspace.dependencies]` in the root Cargo.toml.
workshop-rs.workspace = true

[dev-dependencies]
sha2 = "0.10"
