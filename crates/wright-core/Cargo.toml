[package]
name = "wright-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's independently implemented compiler core."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical Workshop contracts (#143): `signatures` re-exports the
# workshop-rs parse-context trait, and the HIR bridge consumes workshop-rs
# settings/source types. Single pinned reference: `[workspace.dependencies]`
# in the root Cargo.toml.
workshop-rs.workspace = true
wright-ir = { path = "../wright-ir" }
