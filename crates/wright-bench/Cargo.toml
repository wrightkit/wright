[package]
name = "wright-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wright's reproducible performance/resource benchmark harness."

[lints]
workspace = true

[[bin]]
name = "wright-bench"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wright-driver = { path = "../wright-driver" }
wright-transform = { path = "../wright-transform" }
